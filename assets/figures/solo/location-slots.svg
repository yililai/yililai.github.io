<rect x="68" y="132" width="288" height="288" class="box"/>
<ellipse cx="170" cy="229" rx="48" ry="34" class="blue" transform="rotate(-20 170 229)"/>
<ellipse cx="270" cy="303" rx="37" ry="48" class="green" transform="rotate(20 270 303)"/>
<path d="M140 132V420" stroke="#b9c6d3" stroke-dasharray="5 6"/><path d="M212 132V420" stroke="#b9c6d3" stroke-dasharray="5 6"/><path d="M284 132V420" stroke="#b9c6d3" stroke-dasharray="5 6"/><path d="M68 204H356" stroke="#b9c6d3" stroke-dasharray="5 6"/><path d="M68 276H356" stroke="#b9c6d3" stroke-dasharray="5 6"/><path d="M68 348H356" stroke="#b9c6d3" stroke-dasharray="5 6"/><circle cx="170" cy="229" r="5" fill="white"/><circle cx="270" cy="303" r="5" fill="white"/>
<text x="68" y="459" class="small">中心位置 → 对应槽位</text>
<path d="M380 250H456" class="arrow"/>
<text x="405" y="227" text-anchor="middle" class="small">索引</text>
<rect x="478" y="133" width="198" height="287" rx="9" class="box"/>
<text x="577" y="180" text-anchor="middle" class="label">类别分支</text>
<text x="577" y="214" text-anchor="middle" class="small">S × S × C</text>
<text x="577" y="283" text-anchor="middle" class="label">掩码分支</text>
<text x="577" y="317" text-anchor="middle" class="small">H × W × S²</text>
<path d="M690 270H730" class="arrow"/>
<rect x="750" y="135" width="150" height="120" class="box"/><ellipse cx="804" cy="181" rx="28" ry="20" class="blue"/>

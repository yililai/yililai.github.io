<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">另外两条路线：展开相加，或通道重排</title><desc id="desc">用一维卷积和四通道单像素的小例子说明转置卷积与Pixel Shuffle。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b7892"/></marker></defs>
<style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;fill:#24394d;font-size:24px}.title{font-size:30px;font-weight:700}.label{font-size:25px;font-weight:600}.small{font-size:19px;fill:#52697d}.num{font-size:31px;font-variant-numeric:tabular-nums}.arrow{stroke:#5b7892;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="960" height="640" fill="white"/>
<text x="35" y="47" class="title" text-anchor="start">另外两条路线：展开相加，或通道重排</text><text x="45" y="103" class="label" text-anchor="start">转置卷积：每个输入展开一个小核，重叠处相加</text><text x="45" y="144" class="small" text-anchor="start">一维简例：输入 [10,20]；stride=2；示意核 [1,2,1]；padding=0</text><text x="45" y="214" class="small" text-anchor="start">10 的贡献</text><rect x="245" y="170" width="76" height="76" rx="0" fill="rgb(220, 231, 244)" stroke="#d0dbe6" stroke-width="2"/><text x="283.0" y="218.0" class="num" text-anchor="middle">10</text><rect x="321" y="170" width="76" height="76" rx="0" fill="rgb(195, 215, 238)" stroke="#d0dbe6" stroke-width="2"/><text x="359.0" y="218.0" class="num" text-anchor="middle">20</text><rect x="397" y="170" width="76" height="76" rx="0" fill="rgb(220, 231, 244)" stroke="#d0dbe6" stroke-width="2"/><text x="435.0" y="218.0" class="num" text-anchor="middle">10</text><rect x="473" y="170" width="76" height="76" rx="0" fill="rgb(245, 248, 251)" stroke="#d0dbe6" stroke-width="2"/><text x="511.0" y="218.0" class="num" text-anchor="middle">0</text><rect x="549" y="170" width="76" height="76" rx="0" fill="rgb(245, 248, 251)" stroke="#d0dbe6" stroke-width="2"/><text x="587.0" y="218.0" class="num" text-anchor="middle">0</text><text x="45" y="296" class="small" text-anchor="start">20 的贡献</text><rect x="245" y="252" width="76" height="76" rx="0" fill="rgb(245, 248, 251)" stroke="#d0dbe6" stroke-width="2"/><text x="283.0" y="300.0" class="num" text-anchor="middle">0</text><rect x="321" y="252" width="76" height="76" rx="0" fill="rgb(245, 248, 251)" stroke="#d0dbe6" stroke-width="2"/><text x="359.0" y="300.0" class="num" text-anchor="middle">0</text><rect x="397" y="252" width="76" height="76" rx="0" fill="rgb(195, 215, 238)" stroke="#d0dbe6" stroke-width="2"/><text x="435.0" y="300.0" class="num" text-anchor="middle">20</text><rect x="473" y="252" width="76" height="76" rx="0" fill="rgb(145, 183, 226)" stroke="#d0dbe6" stroke-width="2"/><text x="511.0" y="300.0" class="num" text-anchor="middle">40</text><rect x="549" y="252" width="76" height="76" rx="0" fill="rgb(195, 215, 238)" stroke="#d0dbe6" stroke-width="2"/><text x="587.0" y="300.0" class="num" text-anchor="middle">20</text><text x="45" y="378" class="label" text-anchor="start">相加得到</text><rect x="245" y="334" width="76" height="76" rx="0" fill="rgb(220, 231, 244)" stroke="#d0dbe6" stroke-width="2"/><text x="283.0" y="382.0" class="num" text-anchor="middle">10</text><rect x="321" y="334" width="76" height="76" rx="0" fill="rgb(195, 215, 238)" stroke="#d0dbe6" stroke-width="2"/><text x="359.0" y="382.0" class="num" text-anchor="middle">20</text><rect x="397" y="334" width="76" height="76" rx="0" fill="rgb(170, 199, 232)" stroke="#d0dbe6" stroke-width="2"/><text x="435.0" y="382.0" class="num" text-anchor="middle">30</text><rect x="399" y="336" width="72" height="72" fill="none" stroke="#b46d16" stroke-width="4"/><rect x="473" y="334" width="76" height="76" rx="0" fill="rgb(145, 183, 226)" stroke="#d0dbe6" stroke-width="2"/><text x="511.0" y="382.0" class="num" text-anchor="middle">40</text><rect x="549" y="334" width="76" height="76" rx="0" fill="rgb(195, 215, 238)" stroke="#d0dbe6" stroke-width="2"/><text x="587.0" y="382.0" class="num" text-anchor="middle">20</text><text x="45" y="454" class="label" text-anchor="start">Pixel Shuffle：把通道里的数搬到空间位置</text><text x="45" y="497" class="label" text-anchor="start">4 个通道：[10] [20] [30] [40]</text><path d="M555 490 L645 490" class="arrow"/><rect x="710" y="447" width="63" height="63" rx="0" fill="rgb(220, 231, 244)" stroke="#d0dbe6" stroke-width="2"/><text x="741.5" y="488.5" class="num" text-anchor="middle">10</text><rect x="773" y="447" width="63" height="63" rx="0" fill="rgb(195, 215, 238)" stroke="#d0dbe6" stroke-width="2"/><text x="804.5" y="488.5" class="num" text-anchor="middle">20</text><rect x="710" y="510" width="63" height="63" rx="0" fill="rgb(170, 199, 232)" stroke="#d0dbe6" stroke-width="2"/><text x="741.5" y="551.5" class="num" text-anchor="middle">30</text><rect x="773" y="510" width="63" height="63" rx="0" fill="rgb(145, 183, 226)" stroke="#d0dbe6" stroke-width="2"/><text x="804.5" y="551.5" class="num" text-anchor="middle">40</text><text x="45" y="558" class="small" text-anchor="start">重排本身没有可学习参数；前置卷积负责生成这些通道值。</text><text x="45" y="601" class="small" text-anchor="start">以上是机制简例：转置卷积的核为示意值，不能作为真实网络输出。</text>
</svg>
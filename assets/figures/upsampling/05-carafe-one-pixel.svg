<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">同一个新位置，换成内容相关的权重</title><desc id="desc">采用同一2×2输入的零填充3×3邻域与示意权重，计算20.5；不是模型预测。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b7892"/></marker></defs>
<style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;fill:#24394d;font-size:24px}.title{font-size:30px;font-weight:700}.label{font-size:25px;font-weight:600}.small{font-size:19px;fill:#52697d}.num{font-size:31px;font-variant-numeric:tabular-nums}.arrow{stroke:#5b7892;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="960" height="580" fill="white"/>
<text x="35" y="47" class="title" text-anchor="start">同一个新位置，换成内容相关的权重</text><text x="40" y="103" class="label" text-anchor="start">仍计算输出索引 [1,2]；对应低分辨率位置 [0,1]（值 20）</text><text x="45" y="154" class="label" text-anchor="start">3×3 输入邻域</text><rect x="50" y="185" width="74" height="74" rx="0" fill="rgb(245, 248, 251)" stroke="#d0dbe6" stroke-width="2"/><text x="87.0" y="232.0" class="num" text-anchor="middle">0</text><rect x="124" y="185" width="74" height="74" rx="0" fill="rgb(245, 248, 251)" stroke="#d0dbe6" stroke-width="2"/><text x="161.0" y="232.0" class="num" text-anchor="middle">0</text><rect x="198" y="185" width="74" height="74" rx="0" fill="rgb(245, 248, 251)" stroke="#d0dbe6" stroke-width="2"/><text x="235.0" y="232.0" class="num" text-anchor="middle">0</text><rect x="50" y="259" width="74" height="74" rx="0" fill="rgb(220, 231, 244)" stroke="#d0dbe6" stroke-width="2"/><text x="87.0" y="306.0" class="num" text-anchor="middle">10</text><rect x="124" y="259" width="74" height="74" rx="0" fill="rgb(195, 215, 238)" stroke="#d0dbe6" stroke-width="2"/><text x="161.0" y="306.0" class="num" text-anchor="middle">20</text><rect x="126" y="261" width="70" height="70" fill="none" stroke="#b46d16" stroke-width="4"/><rect x="198" y="259" width="74" height="74" rx="0" fill="rgb(245, 248, 251)" stroke="#d0dbe6" stroke-width="2"/><text x="235.0" y="306.0" class="num" text-anchor="middle">0</text><rect x="50" y="333" width="74" height="74" rx="0" fill="rgb(170, 199, 232)" stroke="#d0dbe6" stroke-width="2"/><text x="87.0" y="380.0" class="num" text-anchor="middle">30</text><rect x="124" y="333" width="74" height="74" rx="0" fill="rgb(145, 183, 226)" stroke="#d0dbe6" stroke-width="2"/><text x="161.0" y="380.0" class="num" text-anchor="middle">40</text><rect x="198" y="333" width="74" height="74" rx="0" fill="rgb(245, 248, 251)" stroke="#d0dbe6" stroke-width="2"/><text x="235.0" y="380.0" class="num" text-anchor="middle">0</text><text x="45" y="442" class="small" text-anchor="start">灰色 0 是越界零填充</text><path d="M292 298 L342 298" class="arrow"/><text x="393" y="154" class="label" text-anchor="start">假设预测出的示意权重</text><rect x="385" y="185" width="74" height="74" rx="0" fill="rgb(244, 246, 250)" stroke="#d0dbe6" stroke-width="2"/><text x="422.0" y="232.0" class="num" text-anchor="middle">0.01</text><rect x="459" y="185" width="74" height="74" rx="0" fill="rgb(244, 246, 250)" stroke="#d0dbe6" stroke-width="2"/><text x="496.0" y="232.0" class="num" text-anchor="middle">0.01</text><rect x="533" y="185" width="74" height="74" rx="0" fill="rgb(244, 246, 250)" stroke="#d0dbe6" stroke-width="2"/><text x="570.0" y="232.0" class="num" text-anchor="middle">0.01</text><rect x="385" y="259" width="74" height="74" rx="0" fill="rgb(231, 235, 243)" stroke="#d0dbe6" stroke-width="2"/><text x="422.0" y="306.0" class="num" text-anchor="middle">0.1</text><rect x="459" y="259" width="74" height="74" rx="0" fill="rgb(141, 160, 195)" stroke="#d0dbe6" stroke-width="2"/><text x="496.0" y="306.0" class="num" text-anchor="middle">0.7</text><rect x="533" y="259" width="74" height="74" rx="0" fill="rgb(244, 246, 250)" stroke="#d0dbe6" stroke-width="2"/><text x="570.0" y="306.0" class="num" text-anchor="middle">0.01</text><rect x="385" y="333" width="74" height="74" rx="0" fill="rgb(238, 241, 247)" stroke="#d0dbe6" stroke-width="2"/><text x="422.0" y="380.0" class="num" text-anchor="middle">0.05</text><rect x="459" y="333" width="74" height="74" rx="0" fill="rgb(231, 235, 243)" stroke="#d0dbe6" stroke-width="2"/><text x="496.0" y="380.0" class="num" text-anchor="middle">0.1</text><rect x="533" y="333" width="74" height="74" rx="0" fill="rgb(244, 246, 250)" stroke="#d0dbe6" stroke-width="2"/><text x="570.0" y="380.0" class="num" text-anchor="middle">0.01</text><text x="400" y="442" class="small" text-anchor="start">9 个权重之和 = 1</text><path d="M630 298 L685 298" class="arrow"/><rect x="717" y="252" width="195" height="96" rx="8" fill="#fff6e6" stroke="#dab773" stroke-width="2"/><text x="815" y="310" class="title" text-anchor="middle">20.5</text><text x="45" y="496" class="label" text-anchor="start">10×0.10 + 20×0.70 + 30×0.05 + 40×0.10 = 20.5</text><text x="45" y="539" class="small" text-anchor="start">这套核仅用于手算：没有训练好的预测网络，就不能确定真实 CARAFE 输出。</text>
</svg>
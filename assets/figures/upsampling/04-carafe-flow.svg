<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">CARAFE：网络先预测权重，再重组特征</title><desc id="desc">内容编码器读取局部特征，输出四套九项分数；各套独立softmax后重组原特征。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b7892"/></marker></defs>
<style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;fill:#24394d;font-size:24px}.title{font-size:30px;font-weight:700}.label{font-size:25px;font-weight:600}.small{font-size:19px;fill:#52697d}.num{font-size:31px;font-variant-numeric:tabular-nums}.arrow{stroke:#5b7892;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="960" height="570" fill="white"/>
<text x="35" y="47" class="title" text-anchor="start">CARAFE：网络先预测权重，再重组特征</text><text x="45" y="103" class="label" text-anchor="start">预测支路：读取局部内容 → 生成每个新位置的权重</text><rect x="45" y="145" width="210" height="116" rx="8" fill="#f5f8fc" stroke="#ccd8e4" stroke-width="2"/><text x="150.0" y="188" class="label" text-anchor="middle">1×1 卷积</text><text x="150.0" y="221" class="small" text-anchor="middle">压缩特征通道</text><rect x="355" y="145" width="230" height="116" rx="8" fill="#f5f8fc" stroke="#ccd8e4" stroke-width="2"/><text x="470.0" y="188" class="label" text-anchor="middle">内容编码卷积</text><text x="470.0" y="221" class="small" text-anchor="middle">每个原位置</text><text x="470.0" y="246" class="small" text-anchor="middle">输出 4×9 分数</text><rect x="690" y="145" width="225" height="116" rx="8" fill="#f5f8fc" stroke="#ccd8e4" stroke-width="2"/><text x="802.5" y="188" class="label" text-anchor="middle">重排 + softmax</text><text x="802.5" y="221" class="small" text-anchor="middle">每个新位置的 9 项</text><text x="802.5" y="246" class="small" text-anchor="middle">单独归一化</text><path d="M267 201 L341 201" class="arrow"/><path d="M597 201 L675 201" class="arrow"/><text x="45" y="319" class="label" text-anchor="start">重组支路：原始邻域特征 × 预测权重 → 求和</text><rect x="45" y="355" width="285" height="92" rx="8" fill="#f5f8fc" stroke="#ccd8e4" stroke-width="2"/><text x="187" y="411" class="small" text-anchor="middle">取对应原位置的 3×3 邻域</text><path d="M345 400 L420 400" class="arrow"/><rect x="437" y="355" width="225" height="92" rx="8" fill="#f5f8fc" stroke="#ccd8e4" stroke-width="2"/><text x="550" y="411" class="small" text-anchor="middle">9 项逐一相乘后求和</text><path d="M675 400 L735 400" class="arrow"/><rect x="752" y="355" width="165" height="92" rx="8" fill="#eef6f1" stroke="#a4c4b3" stroke-width="2"/><text x="835" y="411" class="label" text-anchor="middle">一个新值</text><text x="45" y="496" class="small" text-anchor="start">本例放大 2 倍：每个原位置对应 4 个子位置；每个子位置需要一套 3×3 核。</text><text x="45" y="533" class="small" text-anchor="start">原始特征参与重组；压缩特征仅用于预测权重。示意配置，不是训练结果。</text>
</svg>
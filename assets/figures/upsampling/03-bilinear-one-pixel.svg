<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">22.5 到底怎么算出来？</title><desc id="desc">详细演算输出第2行第3列：按x与y的距离比例进行两次线性插值。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b7892"/></marker></defs>
<style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;fill:#24394d;font-size:24px}.title{font-size:30px;font-weight:700}.label{font-size:25px;font-weight:600}.small{font-size:19px;fill:#52697d}.num{font-size:31px;font-variant-numeric:tabular-nums}.arrow{stroke:#5b7892;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="960" height="610" fill="white"/>
<text x="35" y="47" class="title" text-anchor="start">22.5 到底怎么算出来？</text><text x="45" y="102" class="label" text-anchor="start">目标：输出索引 [1,2] → 输入坐标 (x,y) = (0.75,0.25)</text><text x="45" y="155" class="label" text-anchor="start">四个输入值</text><rect x="55" y="185" width="88" height="88" rx="0" fill="rgb(220, 231, 244)" stroke="#d0dbe6" stroke-width="2"/><text x="99.0" y="239.0" class="num" text-anchor="middle">10</text><rect x="143" y="185" width="88" height="88" rx="0" fill="rgb(195, 215, 238)" stroke="#d0dbe6" stroke-width="2"/><text x="187.0" y="239.0" class="num" text-anchor="middle">20</text><rect x="55" y="273" width="88" height="88" rx="0" fill="rgb(170, 199, 232)" stroke="#d0dbe6" stroke-width="2"/><text x="99.0" y="327.0" class="num" text-anchor="middle">30</text><rect x="143" y="273" width="88" height="88" rx="0" fill="rgb(145, 183, 226)" stroke="#d0dbe6" stroke-width="2"/><text x="187.0" y="327.0" class="num" text-anchor="middle">40</text><path d="M258 270 L326 270" class="arrow"/><text x="365" y="155" class="label" text-anchor="start">按距离得到的权重</text><rect x="350" y="185" width="105" height="105" rx="0" fill="rgb(217, 224, 236)" stroke="#d0dbe6" stroke-width="2"/><text x="402.5" y="247.5" class="num" text-anchor="middle">0.1875</text><rect x="455" y="185" width="105" height="105" rx="0" fill="rgb(161, 177, 206)" stroke="#d0dbe6" stroke-width="2"/><text x="507.5" y="247.5" class="num" text-anchor="middle">0.5625</text><rect x="350" y="290" width="105" height="105" rx="0" fill="rgb(236, 240, 246)" stroke="#d0dbe6" stroke-width="2"/><text x="402.5" y="352.5" class="num" text-anchor="middle">0.0625</text><rect x="455" y="290" width="105" height="105" rx="0" fill="rgb(217, 224, 236)" stroke="#d0dbe6" stroke-width="2"/><text x="507.5" y="352.5" class="num" text-anchor="middle">0.1875</text><path d="M590 270 L650 270" class="arrow"/><rect x="690" y="219" width="200" height="106" rx="8" fill="#fff6e6" stroke="#dab773" stroke-width="2"/><text x="790" y="283" class="title" text-anchor="middle">22.5</text><text x="45" y="426" class="label" text-anchor="start">先横向：10×0.25 + 20×0.75 = 17.5</text><text x="45" y="467" class="label" text-anchor="start">             30×0.25 + 40×0.75 = 37.5</text><text x="45" y="516" class="label" text-anchor="start">再纵向：17.5×0.75 + 37.5×0.25 = 22.5</text><text x="45" y="569" class="small" text-anchor="start">横向更靠近右侧 → 右侧权重 0.75；纵向更靠近上方 → 上方权重 0.75。</text>
</svg>